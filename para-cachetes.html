<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Cachetes ❤</title>
<meta name="description" content="Una rosa que no se marchita.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* =============================================================
   Para Cachetes — hoja de estilos
   Paleta: rojo pasión sobre negro
   ============================================================= */

:root {
  --negro:        #08060a;
  --negro-suave:  #100a0e;
  --rojo:         #d0021b;
  --rojo-vivo:    #ff2d4d;
  --rojo-hondo:   #6b0210;
  --rosa-palido:  #ffd9de;
  --crema:        #f6ede9;
  --gris:         #a08b8f;
  --serif:  'Cormorant Garamond', Georgia, serif;
  --sans:   'Montserrat', system-ui, sans-serif;
  --script: 'Great Vibes', 'Cormorant Garamond', cursive;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--negro);
  color: var(--crema);
  font-family: var(--sans);
  font-weight: 300;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Fondo con brillo rojo muy tenue */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 50% 0%,   rgba(208, 2, 27, .13), transparent 70%),
    radial-gradient(ellipse 70% 60% at 80% 100%, rgba(107, 2, 16, .18), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

#petalos {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.seccion {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6rem 1.5rem;
}

.contenedor {
  width: 100%;
  max-width: 860px;
  margin: 0 auto;
  text-align: center;
}

/* --- Animación de aparición --- */
[data-rev] {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 1.1s cubic-bezier(.22,.61,.36,1),
              transform 1.1s cubic-bezier(.22,.61,.36,1);
}
[data-rev].visible { opacity: 1; transform: none; }

/* ══════════ 1. HERO ══════════ */
.hero {
  padding: 0 0 9rem;
  overflow: hidden;
  justify-content: flex-end;
}

#rosa {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

.vineta {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(8,6,10,.75) 85%);
}

.hero-texto {
  position: relative;
  z-index: 3;
  text-align: center;
  padding: 0 1.5rem;
  margin-top: 0;
  text-shadow: 0 2px 30px rgba(8,6,10,.95), 0 0 60px rgba(8,6,10,.8);
}

.saludo {
  font-family: var(--sans);
  font-weight: 200;
  letter-spacing: .5em;
  text-transform: uppercase;
  font-size: .68rem;
  color: var(--gris);
  margin-bottom: .8rem;
  transition-delay: 2.6s;
}

.titulo-hero {
  font-family: var(--script);
  font-weight: 400;
  font-size: clamp(3.6rem, 13vw, 7.5rem);
  line-height: .95;
  color: var(--crema);
  transition-delay: 2.9s;
  text-shadow: 0 0 42px rgba(255, 45, 77, .38), 0 4px 40px rgba(0,0,0,.9);
}

.subtitulo {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1rem, 2.4vw, 1.32rem);
  font-weight: 300;
  color: rgba(246,237,233,.72);
  max-width: 30rem;
  margin: 1.4rem auto 0;
  line-height: 1.65;
  transition-delay: 3.3s;
}

.scroll-hint {
  position: absolute;
  bottom: 2.4rem;
  left: 50%;
  transform: translateX(-50%) translateY(28px);
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .7rem;
  transition-delay: 4s;
}
.scroll-hint.visible { transform: translateX(-50%); }
.scroll-hint span {
  font-size: .58rem;
  letter-spacing: .34em;
  text-transform: uppercase;
  color: var(--gris);
}
.scroll-hint .linea {
  width: 1px;
  height: 46px;
  background: linear-gradient(var(--rojo-vivo), transparent);
  animation: fluir 2.4s ease-in-out infinite;
}
@keyframes fluir {
  0%, 100% { transform: scaleY(.35); opacity: .35; transform-origin: top; }
  50%      { transform: scaleY(1);   opacity: 1;   transform-origin: top; }
}

/* ══════════ Títulos de sección ══════════ */
.titulo-seccion {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(2rem, 5.5vw, 3.1rem);
  letter-spacing: .01em;
  margin-bottom: 1rem;
}
.titulo-seccion::after {
  content: '';
  display: block;
  width: 54px;
  height: 1px;
  margin: 1.4rem auto 0;
  background: linear-gradient(90deg, transparent, var(--rojo-vivo), transparent);
}

.pista {
  font-size: .64rem;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--gris);
  margin: 1.6rem 0 3rem;
  transition-delay: .15s;
}

/* ══════════ 2. CARTA ══════════ */
.carta { background: linear-gradient(180deg, transparent, rgba(107,2,16,.07) 50%, transparent); }

.frase {
  position: relative;
  margin: 3.2rem auto 3.6rem;
  max-width: 40rem;
  transition-delay: .2s;
}
.frase .comilla {
  position: absolute;
  top: -3.2rem;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--serif);
  font-size: 7rem;
  line-height: 1;
  color: rgba(255,45,77,.22);
  pointer-events: none;
}
.frase p {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1.25rem, 3.4vw, 1.85rem);
  line-height: 1.6;
  color: var(--rosa-palido);
  min-height: 4.5em;
}
.frase p .cursor {
  display: inline-block;
  width: 2px;
  height: 1em;
  vertical-align: -.12em;
  background: var(--rojo-vivo);
  margin-left: 3px;
  animation: parpadeo .85s steps(2) infinite;
}
@keyframes parpadeo { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

.parrafos {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  max-width: 34rem;
  margin: 0 auto;
}
.parrafos p {
  font-family: var(--serif);
  font-size: clamp(1.02rem, 2.3vw, 1.16rem);
  line-height: 1.85;
  color: rgba(246,237,233,.8);
  position: relative;
  padding-left: 1.4rem;
  text-align: left;
}
.parrafos p::before {
  content: '';
  position: absolute;
  left: 0; top: .55em;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--rojo);
  box-shadow: 0 0 12px var(--rojo-vivo);
}

.firma, .firma-final {
  font-family: var(--script);
  font-size: 1.7rem;
  color: var(--rosa-palido);
  margin-top: 3rem;
  opacity: .85;
  transition-delay: .3s;
}

/* ══════════ 3. TARJETAS ══════════ */
.tarjetas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.1rem;
  max-width: 780px;
  margin: 0 auto;
}

.tarjeta {
  perspective: 1200px;
  height: 190px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  color: inherit;
}
.tarjeta-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .75s cubic-bezier(.4,.2,.2,1);
  transform-style: preserve-3d;
}
.tarjeta.volteada .tarjeta-inner { transform: rotateY(180deg); }

.cara {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.6rem 1.2rem;
  text-align: center;
  border: 1px solid rgba(255,45,77,.22);
  background: linear-gradient(160deg, rgba(28,10,14,.9), rgba(12,7,10,.92));
  transition: border-color .4s, box-shadow .4s;
}
.tarjeta:hover .cara { border-color: rgba(255,45,77,.55); box-shadow: 0 0 34px rgba(208,2,27,.22); }

.cara-frente {
  font-family: var(--serif);
  font-size: 1.32rem;
  color: var(--crema);
  flex-direction: column;
  gap: .9rem;
}
.cara-frente .flor { font-size: 1.5rem; filter: drop-shadow(0 0 10px rgba(255,45,77,.6)); }

.cara-atras {
  transform: rotateY(180deg);
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.02rem;
  line-height: 1.65;
  color: var(--rosa-palido);
  background: linear-gradient(160deg, rgba(107,2,16,.55), rgba(20,4,8,.95));
  border-color: rgba(255,45,77,.4);
}

/* ══════════ 4. JARDÍN ══════════ */
.jardin { padding-bottom: 3rem; }
#jardin-canvas {
  width: 100%;
  max-width: 960px;
  height: 46vh;
  min-height: 300px;
  margin: 0 auto;
  display: block;
  cursor: crosshair;
  border-radius: 4px;
  border: 1px solid rgba(255,45,77,.14);
  background:
    radial-gradient(ellipse 70% 90% at 50% 100%, rgba(107,2,16,.28), transparent 70%),
    linear-gradient(180deg, rgba(10,6,12,.6), rgba(18,6,12,.85));
  touch-action: manipulation;
}

.btn-fantasma {
  margin-top: 1.6rem;
  background: none;
  border: 1px solid rgba(255,45,77,.3);
  color: var(--gris);
  font-family: var(--sans);
  font-size: .6rem;
  letter-spacing: .28em;
  text-transform: uppercase;
  padding: .7rem 1.5rem;
  border-radius: 999px;
  cursor: pointer;
  transition: .35s;
}
.btn-fantasma:hover { color: var(--crema); border-color: var(--rojo-vivo); }

/* ══════════ 5. FINAL ══════════ */
.final { text-align: center; }

.corazon {
  position: relative;
  width: 62px;
  height: 62px;
  margin: 0 auto 2.4rem;
  background: var(--rojo);
  transform: rotate(-45deg);
  box-shadow: 0 0 60px rgba(208,2,27,.6);
  animation: latir 1.5s ease-in-out infinite;
}
.corazon::before, .corazon::after {
  content: '';
  position: absolute;
  width: 62px;
  height: 62px;
  background: var(--rojo);
  border-radius: 50%;
}
.corazon::before { top: -31px; left: 0; }
.corazon::after  { top: 0; left: 31px; }
@keyframes latir {
  0%, 100%  { transform: rotate(-45deg) scale(1); }
  14%       { transform: rotate(-45deg) scale(1.16); }
  28%       { transform: rotate(-45deg) scale(1); }
  42%       { transform: rotate(-45deg) scale(1.11); }
}

.titulo-final {
  font-family: var(--script);
  font-size: clamp(2.6rem, 9vw, 5rem);
  color: var(--crema);
  text-shadow: 0 0 44px rgba(255,45,77,.4);
  line-height: 1.1;
}
.texto-final {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1rem, 2.4vw, 1.2rem);
  color: rgba(246,237,233,.72);
  max-width: 30rem;
  margin: 1.6rem auto 2.6rem;
  line-height: 1.75;
  transition-delay: .15s;
}

.btn {
  background: transparent;
  border: 1px solid var(--rojo);
  color: var(--crema);
  font-family: var(--sans);
  font-size: .64rem;
  letter-spacing: .32em;
  text-transform: uppercase;
  padding: 1rem 2.4rem;
  border-radius: 999px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: color .4s, border-color .4s;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--rojo);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .45s cubic-bezier(.4,.2,.2,1);
  z-index: -1;
}
.btn:hover { border-color: var(--rojo-vivo); box-shadow: 0 0 34px rgba(208,2,27,.4); }
.btn:hover::after { transform: scaleX(1); }

/* Corazones que salen al presionar el botón */
.corazon-vuela {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  font-size: 20px;
  will-change: transform, opacity;
}

@media (max-width: 640px) {
  .seccion.hero { padding: 0 0 11rem; }
  .subtitulo { max-width: 21rem; }
  .seccion { padding: 4.5rem 1.2rem; }
  .tarjeta { height: 170px; }
  .parrafos p { font-size: 1rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  [data-rev] { opacity: 1; transform: none; }
}

</style>

<script>
/* =============================================================
   rosa.js — Una rosa roja dibujada con matemáticas.
   Crece el tallo, brotan las hojas y la flor se abre
   pétalo por pétalo. Después respira, para siempre.
   ============================================================= */

(function () {
  'use strict';

  const canvas = document.getElementById('rosa');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const CAPAS = 6;            // capas de pétalos
  const DURACION = 5200;      // ms que tarda en florecer
  let W = 0, H = 0, DPR = 1;
  let inicio = null;
  let chispas = [];

  /* ---------- utilidades ---------- */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const suave = t => t * t * (3 - 2 * t);                    // smoothstep
  const salida = t => 1 - Math.pow(1 - t, 3);                // easeOutCubic

  function medir() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ---------- chispas de luz alrededor de la flor ---------- */
  function crearChispas() {
    chispas = [];
    const n = W < 640 ? 26 : 46;
    for (let i = 0; i < n; i++) {
      chispas.push({
        a: Math.random() * Math.PI * 2,
        r: 60 + Math.random() * (Math.min(W, H) * 0.42),
        vel: (Math.random() - 0.5) * 0.0016,
        tam: Math.random() * 1.6 + 0.4,
        fase: Math.random() * Math.PI * 2,
        y: (Math.random() - 0.5) * 60
      });
    }
  }

  /* ---------- un pétalo ---------- */
  function petalo(ang, dist, ancho, alto, curva, relleno, borde) {
    ctx.save();
    ctx.rotate(ang);
    ctx.translate(0, -dist);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo( ancho * 0.9, -alto * 0.12,  ancho * curva, -alto * 0.86, 0, -alto);
    ctx.bezierCurveTo(-ancho * curva, -alto * 0.86, -ancho * 0.9, -alto * 0.12, 0, 0);
    ctx.closePath();
    ctx.fillStyle = relleno;
    ctx.fill();
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = borde;
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- el tallo, con hojas y espinas ---------- */
  function tallo(cx, cy, largo, p) {
    if (p <= 0) return;
    const fin = cy + largo;
    const y = cy + largo * (1 - p);   // crece de abajo hacia arriba

    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(46, 84, 46, .9)';
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(cx, fin);
    // curva suave del tallo
    for (let t = 0; t <= 1.001; t += 0.02) {
      const yy = fin - largo * t;
      if (yy < y) break;
      ctx.lineTo(cx + Math.sin(t * 2.4) * 7, yy);
    }
    ctx.stroke();

    // brillo del tallo
    ctx.strokeStyle = 'rgba(120, 175, 110, .35)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // hojas
    [0.34, 0.6].forEach((h, i) => {
      const t = clamp((p - h) / 0.22, 0, 1);
      if (t <= 0) return;
      const yy = fin - largo * h;
      const lado = i === 0 ? 1 : -1;
      const L = 46 * salida(t), A = 17 * salida(t);
      ctx.save();
      ctx.translate(cx + Math.sin(h * 2.4) * 7, yy);
      ctx.rotate(lado * (0.75 + Math.sin(h * 3) * 0.1));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(L * 0.5,  A, L, 0);
      ctx.quadraticCurveTo(L * 0.5, -A, 0, 0);
      const g = ctx.createLinearGradient(0, 0, L, 0);
      g.addColorStop(0, 'rgba(40, 78, 40, .95)');
      g.addColorStop(1, 'rgba(88, 138, 74, .8)');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,190,140,.28)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(L, 0);
      ctx.stroke();
      ctx.restore();
    });
    ctx.restore();
  }

  /* ---------- la flor ---------- */
  function flor(cx, cy, escala, p, t) {
    if (p <= 0) return;
    ctx.save();
    ctx.translate(cx, cy);
    // respiración leve cuando ya está abierta
    const respira = 1 + Math.sin(t / 1600) * 0.012 * p;
    ctx.scale(escala * respira, escala * respira);
    ctx.rotate(Math.sin(t / 5200) * 0.02);

    // resplandor
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 150);
    glow.addColorStop(0, `rgba(255, 45, 77, ${0.16 * p})`);
    glow.addColorStop(1, 'rgba(255, 45, 77, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 150, 0, Math.PI * 2);
    ctx.fill();

    // sépalos verdes detrás
    const sp = clamp(p * 1.4, 0, 1);
    for (let i = 0; i < 5; i++) {
      ctx.save();
      ctx.globalAlpha = sp * 0.9;
      petalo(
        (i / 5) * Math.PI * 2 + 0.3, 6 * sp, 12 * sp, 78 * sp, 0.35,
        'rgba(44, 82, 44, .85)', 'rgba(0,0,0,.2)'
      );
      ctx.restore();
    }

    // capas de pétalos: de afuera hacia adentro
    for (let capa = CAPAS - 1; capa >= 0; capa--) {
      const retraso = (CAPAS - 1 - capa) * 0.09;
      const lp = suave(clamp((p - retraso) / 0.55, 0, 1));
      if (lp <= 0) continue;

      const n = 5 + capa * 2;                       // pétalos por capa
      const k = capa / (CAPAS - 1);                 // 0 = centro, 1 = borde
      const dist = (4 + k * 30) * lp;
      const alto = (24 + k * 62) * lp;
      const ancho = (16 + k * 34) * lp;
      const giro = capa * 0.42 + Math.sin(t / 7000 + capa) * 0.01;
      const apertura = 0.55 + k * 0.5;

      for (let i = 0; i < n; i++) {
        const ang = giro + (i / n) * Math.PI * 2;
        // sombra hacia el centro: más oscuro adentro, más vivo afuera
        const l1 = 22 + k * 26;
        const l2 = 34 + k * 30;
        const g = ctx.createLinearGradient(0, 0, 0, -alto);
        g.addColorStop(0, `hsl(350, 88%, ${l1}%)`);
        g.addColorStop(0.55, `hsl(352, 90%, ${l2}%)`);
        g.addColorStop(1, `hsl(355, 92%, ${l2 + 12}%)`);
        petalo(ang, dist, ancho, alto, apertura, g, 'rgba(40, 0, 6, .35)');
      }
    }

    // corazón de la rosa
    ctx.beginPath();
    ctx.arc(0, 0, 9 * p, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(348, 90%, 16%, ${p})`;
    ctx.fill();

    ctx.restore();
  }

  /* ---------- chispas ---------- */
  function dibujarChispas(cx, cy, t, p) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const c of chispas) {
      c.a += c.vel;
      const brillo = (Math.sin(t / 900 + c.fase) * 0.5 + 0.5) * p;
      const x = cx + Math.cos(c.a) * c.r;
      const y = cy + Math.sin(c.a) * c.r * 0.55 + c.y;
      ctx.beginPath();
      ctx.arc(x, y, c.tam, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 190, 200, ${0.5 * brillo})`;
      ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- bucle ---------- */
  function cuadro(ts) {
    if (inicio === null) inicio = ts;
    const t = ts - inicio;

    ctx.clearRect(0, 0, W, H);

    const base = Math.min(W, H);
    // en ventanas bajitas la flor se achica y sube, para no tapar el texto
    const escala = clamp(Math.min(W, H * 0.85) / 640, 0.45, 1.05);
    const cx = W / 2;
    const cy = H * 0.26;
    const largoTallo = H * 0.32;

    const avance = clamp(t / DURACION, 0, 1);
    const pTallo = suave(clamp(avance / 0.34, 0, 1));
    const pFlor  = clamp((avance - 0.22) / 0.78, 0, 1);

    tallo(cx, cy, largoTallo, pTallo);
    flor(cx, cy, escala, pFlor, t);
    dibujarChispas(cx, cy, t, pFlor);

    requestAnimationFrame(cuadro);
  }

  function iniciar() {
    medir();
    crearChispas();
    requestAnimationFrame(cuadro);
  }

  let temporizador;
  window.addEventListener('resize', () => {
    clearTimeout(temporizador);
    temporizador = setTimeout(() => { medir(); crearChispas(); }, 150);
  });

  iniciar();
})();

</script>
<script>
/* =============================================================
   petalos.js — Lluvia suave de pétalos rojos en todo el fondo.
   ============================================================= */

(function () {
  'use strict';

  const canvas = document.getElementById('petalos');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let petalos = [];
  let extra = [];   // ráfaga temporal (botón "te amo")

  function medir() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function nuevo(y) {
    return {
      x: Math.random() * W,
      y: y !== undefined ? y : -20 - Math.random() * H,
      tam: 6 + Math.random() * 11,
      vy: 0.35 + Math.random() * 0.85,
      vx: (Math.random() - 0.5) * 0.5,
      giro: Math.random() * Math.PI * 2,
      vgiro: (Math.random() - 0.5) * 0.022,
      vaiven: Math.random() * Math.PI * 2,
      alfa: 0.25 + Math.random() * 0.45,
      tono: 348 + Math.random() * 10,
      luz: 32 + Math.random() * 22
    };
  }

  function crear() {
    const n = W < 640 ? 22 : 40;
    petalos = Array.from({ length: n }, () => nuevo());
  }

  function forma(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.giro);
    ctx.scale(1, 0.55 + Math.sin(p.vaiven) * 0.4);   // efecto de girar en el aire
    ctx.beginPath();
    ctx.moveTo(0, -p.tam);
    ctx.bezierCurveTo( p.tam,  -p.tam * 0.5,  p.tam * 0.75, p.tam * 0.75, 0, p.tam);
    ctx.bezierCurveTo(-p.tam * 0.75, p.tam * 0.75, -p.tam, -p.tam * 0.5, 0, -p.tam);
    ctx.closePath();
    ctx.fillStyle = `hsla(${p.tono}, 85%, ${p.luz}%, ${p.alfa})`;
    ctx.fill();
    ctx.restore();
  }

  function mover(p, dt) {
    p.vaiven += 0.02 * dt;
    p.y += p.vy * dt;
    p.x += (p.vx + Math.sin(p.vaiven) * 0.5) * dt;
    p.giro += p.vgiro * dt;
  }

  let ultimo = 0;
  function cuadro(ts) {
    const dt = Math.min((ts - ultimo) / 16.67, 3) || 1;
    ultimo = ts;

    ctx.clearRect(0, 0, W, H);

    for (const p of petalos) {
      mover(p, dt);
      if (p.y - p.tam > H) Object.assign(p, nuevo(-20));
      if (p.x < -40) p.x = W + 40;
      if (p.x > W + 40) p.x = -40;
      forma(p);
    }

    for (let i = extra.length - 1; i >= 0; i--) {
      const p = extra[i];
      mover(p, dt);
      p.alfa -= 0.0035 * dt;
      if (p.alfa <= 0 || p.y - p.tam > H) { extra.splice(i, 1); continue; }
      forma(p);
    }

    requestAnimationFrame(cuadro);
  }

  /* Ráfaga: se usa desde app.js cuando ella presiona el botón */
  window.lluviaDePetalos = function (cantidad) {
    for (let i = 0; i < (cantidad || 60); i++) {
      const p = nuevo(-Math.random() * H * 0.6);
      p.vy *= 2.1;
      p.alfa = 0.5 + Math.random() * 0.5;
      extra.push(p);
    }
  };

  let temporizador;
  window.addEventListener('resize', () => {
    clearTimeout(temporizador);
    temporizador = setTimeout(() => { medir(); crear(); }, 150);
  });

  medir();
  crear();
  requestAnimationFrame(cuadro);
})();

</script>
<script>
/* =============================================================
   jardin.js — Toca la pantalla y nace una rosa con un mensaje.
   ============================================================= */

(function () {
  'use strict';

  const canvas = document.getElementById('jardin-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const btnLimpiar = document.getElementById('limpiar-jardin');

  let W = 0, H = 0, DPR = 1;
  let flores = [];
  let luciernagas = [];
  let indiceMensaje = 0;

  const MENSAJES = (window.CONTENIDO && CONTENIDO.jardin && CONTENIDO.jardin.mensajes) || ['Te amo'];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const salida = t => 1 - Math.pow(1 - t, 3);

  function medir() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    crearLuciernagas();
  }

  function crearLuciernagas() {
    const n = W < 640 ? 14 : 26;
    luciernagas = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.6 + 0.5,
      vx: (Math.random() - 0.5) * 0.22,
      vy: (Math.random() - 0.5) * 0.18,
      fase: Math.random() * Math.PI * 2
    }));
  }

  function sembrar(x, y) {
    if (flores.length > 70) flores.shift();
    flores.push({
      x, y,
      nace: performance.now(),
      alto: 42 + Math.random() * 58,
      escala: 0.55 + Math.random() * 0.6,
      giro: Math.random() * Math.PI * 2,
      tono: 344 + Math.random() * 14,
      mensaje: MENSAJES[indiceMensaje++ % MENSAJES.length],
      inclina: (Math.random() - 0.5) * 0.28
    });
  }

  function dibujarFlor(f, t) {
    const edad = (t - f.nace) / 1400;
    const p = salida(clamp(edad, 0, 1));
    if (p <= 0) return;

    const balanceo = Math.sin(t / 1300 + f.x) * 0.045;
    const alto = f.alto * p;

    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.inclina + balanceo);

    // tallo
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(6, -alto * 0.55, 0, -alto);
    ctx.strokeStyle = 'rgba(70, 120, 66, .75)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.stroke();

    // hojita
    if (p > 0.45) {
      const hp = clamp((p - 0.45) / 0.55, 0, 1);
      ctx.beginPath();
      ctx.moveTo(2, -alto * 0.5);
      ctx.quadraticCurveTo(14 * hp, -alto * 0.58, 20 * hp, -alto * 0.44);
      ctx.quadraticCurveTo(12 * hp, -alto * 0.4, 2, -alto * 0.5);
      ctx.fillStyle = 'rgba(64, 112, 60, .7)';
      ctx.fill();
    }

    // flor
    ctx.translate(0, -alto);
    ctx.rotate(f.giro);
    const s = f.escala * p;
    for (let capa = 2; capa >= 0; capa--) {
      const n = 5 + capa * 2;
      const k = capa / 2;
      const r = (5 + k * 12) * s;
      const a = (7 + k * 7) * s;
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2 + capa * 0.5;
        ctx.save();
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.7, a * 0.62, r * 0.85, 0, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${f.tono}, 88%, ${28 + k * 22}%, .95)`;
        ctx.fill();
        ctx.restore();
      }
    }
    ctx.beginPath();
    ctx.arc(0, 0, 3.2 * s, 0, Math.PI * 2);
    ctx.fillStyle = 'hsla(46, 90%, 62%, .9)';
    ctx.fill();

    // resplandor
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 40 * s);
    g.addColorStop(0, `hsla(${f.tono}, 90%, 55%, .16)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, 40 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // mensaje flotante durante los primeros segundos
    const vida = (t - f.nace) / 3800;
    if (vida < 1) {
      const alfa = vida < 0.2 ? vida / 0.2 : 1 - (vida - 0.2) / 0.8;
      ctx.save();
      ctx.globalAlpha = clamp(alfa, 0, 1);
      ctx.font = "italic 15px 'Cormorant Garamond', Georgia, serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd9de';
      ctx.shadowColor = 'rgba(255,45,77,.9)';
      ctx.shadowBlur = 14;
      ctx.fillText(f.mensaje, f.x, f.y - f.alto - 26 - vida * 22);
      ctx.restore();
    }
  }

  function cuadro(t) {
    ctx.clearRect(0, 0, W, H);

    // luciérnagas
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const l of luciernagas) {
      l.x += l.vx; l.y += l.vy;
      if (l.x < 0) l.x = W; if (l.x > W) l.x = 0;
      if (l.y < 0) l.y = H; if (l.y > H) l.y = 0;
      const b = Math.sin(t / 700 + l.fase) * 0.5 + 0.5;
      ctx.beginPath();
      ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 170, 185, ${0.35 * b})`;
      ctx.fill();
    }
    ctx.restore();

    for (const f of flores) dibujarFlor(f, t);
    requestAnimationFrame(cuadro);
  }

  /* --- interacción --- */
  function punto(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  }

  canvas.addEventListener('click', e => { const p = punto(e); sembrar(p.x, p.y); });
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const p = punto(e);
    sembrar(p.x, p.y);
  }, { passive: false });

  if (btnLimpiar) btnLimpiar.addEventListener('click', () => { flores = []; indiceMensaje = 0; });

  /* Siembra unas cuantas sola, para que no se vea vacío */
  let sembrado = false;
  const obs = new IntersectionObserver(entradas => {
    entradas.forEach(en => {
      if (en.isIntersecting && !sembrado) {
        sembrado = true;
        [0.18, 0.4, 0.62, 0.84].forEach((fx, i) => {
          setTimeout(() => sembrar(W * fx, H * (0.68 + Math.random() * 0.2)), i * 420);
        });
      }
    });
  }, { threshold: 0.35 });
  obs.observe(canvas);

  let temporizador;
  window.addEventListener('resize', () => {
    clearTimeout(temporizador);
    temporizador = setTimeout(medir, 150);
  });

  medir();
  requestAnimationFrame(cuadro);
})();

</script>
<script>
/* =============================================================
   app.js — Arma la página con los textos de contenido.js,
   revela las secciones al bajar y maneja las tarjetas.
   ============================================================= */

(function () {
  'use strict';

  const C = window.CONTENIDO || {};
  const $  = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  /* ---------- 1. Textos ---------- */
  function pintarTextos() {
    if (C.hero) {
      $('.saludo').textContent = C.hero.saludo;
      $('.titulo-hero').textContent = C.hero.titulo;
      $('.subtitulo').textContent = C.hero.subtitulo;
      $('.scroll-hint span').textContent = C.hero.scroll;
      document.title = `${C.hero.saludo} ${C.hero.titulo} ❤`;
    }

    if (C.carta) {
      $('#carta .titulo-seccion').textContent = C.carta.titulo;
      const cont = $('#carta-parrafos');
      C.carta.parrafos.forEach((txt, i) => {
        const p = document.createElement('p');
        p.textContent = txt;
        p.setAttribute('data-rev', '');
        p.style.transitionDelay = (0.12 * i) + 's';
        cont.appendChild(p);
      });
      $('#carta .firma').textContent = C.firma || '';
    }

    if (C.razones) {
      $('#razones .titulo-seccion').textContent = C.razones.titulo;
      $('#razones .pista').textContent = C.razones.subtitulo;
      const cont = $('#tarjetas');
      C.razones.tarjetas.forEach((t, i) => {
        const b = document.createElement('button');
        b.className = 'tarjeta';
        b.type = 'button';
        b.setAttribute('data-rev', '');
        b.style.transitionDelay = (0.08 * i) + 's';
        b.innerHTML =
          '<div class="tarjeta-inner">' +
            '<div class="cara cara-frente"><span class="flor">🌹</span><span></span></div>' +
            '<div class="cara cara-atras"><span></span></div>' +
          '</div>';
        b.querySelector('.cara-frente span:last-child').textContent = t.frente;
        b.querySelector('.cara-atras span').textContent = t.reverso;
        b.addEventListener('click', () => b.classList.toggle('volteada'));
        cont.appendChild(b);
      });
    }

    if (C.jardin) {
      $('#jardin .titulo-seccion').textContent = C.jardin.titulo;
      $('#jardin .pista').textContent = C.jardin.subtitulo;
    }

    if (C.final) {
      $('.titulo-final').textContent = C.final.titulo;
      $('.texto-final').textContent = C.final.texto;
      $('#btn-final').textContent = C.final.boton;
      $('.firma-final').textContent = C.firma || '';
    }
  }

  /* ---------- 2. Revelar al bajar ---------- */
  function revelar() {
    const obs = new IntersectionObserver(entradas => {
      entradas.forEach(en => {
        if (en.isIntersecting) {
          en.target.classList.add('visible');
          obs.unobserve(en.target);
        }
      });
    }, { threshold: 0.18, rootMargin: '0px 0px -40px 0px' });

    $$('[data-rev]').forEach(el => obs.observe(el));
    // el hero se revela solo, con su propio retraso
    $$('#inicio [data-rev]').forEach(el => {
      obs.unobserve(el);
      el.classList.add('visible');
    });
  }

  /* ---------- 3. Máquina de escribir para la frase ---------- */
  function escribir() {
    const destino = $('#frase-texto');
    if (!destino || !C.carta) return;
    const texto = C.carta.frase;
    let i = 0, corriendo = false;

    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    function paso() {
      if (i <= texto.length) {
        destino.textContent = texto.slice(0, i);
        destino.appendChild(cursor);
        i++;
        setTimeout(paso, texto[i - 1] === ',' || texto[i - 1] === '.' ? 280 : 34);
      } else {
        setTimeout(() => cursor.remove(), 1400);
      }
    }

    const obs = new IntersectionObserver(en => {
      if (en[0].isIntersecting && !corriendo) { corriendo = true; paso(); }
    }, { threshold: 0.5 });
    obs.observe(destino);
  }

  /* ---------- 4. Botón final: corazones y pétalos ---------- */
  function botonFinal() {
    const btn = $('#btn-final');
    if (!btn) return;
    btn.addEventListener('click', () => {
      if (window.lluviaDePetalos) window.lluviaDePetalos(70);

      const r = btn.getBoundingClientRect();
      for (let i = 0; i < 22; i++) {
        const c = document.createElement('div');
        c.className = 'corazon-vuela';
        c.textContent = '❤';
        c.style.left = (r.left + r.width / 2) + 'px';
        c.style.top  = (r.top + r.height / 2) + 'px';
        c.style.fontSize = (12 + Math.random() * 22) + 'px';
        c.style.color = `hsl(${348 + Math.random() * 12}, 90%, ${45 + Math.random() * 25}%)`;
        document.body.appendChild(c);

        const ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.1;
        const dist = 140 + Math.random() * 260;
        c.animate([
          { transform: 'translate(-50%,-50%) scale(.2) rotate(0deg)', opacity: 1 },
          { transform: `translate(calc(-50% + ${Math.cos(ang) * dist}px), calc(-50% + ${Math.sin(ang) * dist}px)) scale(1.1) rotate(${(Math.random() - .5) * 200}deg)`, opacity: 0 }
        ], { duration: 1500 + Math.random() * 1100, easing: 'cubic-bezier(.16,.9,.3,1)' })
         .onfinish = () => c.remove();
      }

      const corazon = $('#corazon');
      if (corazon) {
        corazon.style.animation = 'none';
        void corazon.offsetWidth;
        corazon.style.animation = 'latir .7s ease-in-out 4';
        setTimeout(() => { corazon.style.animation = 'latir 1.5s ease-in-out infinite'; }, 2900);
      }
    });
  }

  pintarTextos();
  revelar();
  escribir();
  botonFinal();
})();

</script>
</body>
